  <g transform="translate(620 140)"><rect class="p" width="530" height="250" rx="26"/><text class="t h" x="28" y="42" font-size="22">GPU · GeForce RTX 5070 样本</text><text class="t m" x="28" y="68" font-size="14">万丽 OC 12GB；末点为 8/25 最近快照</text><line class="g" x1="35" y1="198" x2="495" y2="198"/><path class="line" stroke="#ff7b59" d="M45 186 L490 86"/><g fill="#ff7b59"><circle class="dot" cx="45" cy="186" r="7"/><circle class="dot" cx="490" cy="86" r="7"/></g><g class="t m" font-size="12"><text x="32" y="224">7/22</text><text x="458" y="224">8/25</text></g><text class="t m" x="58" y="181" font-size="13">¥5,249</text><text class="t h" x="405" y="110" font-size="15">¥6,899</text></g>
  <g transform="translate(50 420)"><rect class="p" width="530" height="250" rx="26"/><text class="t h" x="28" y="42" font-size="22">主板 · B850M 零售样本</text><text class="t m" x="28" y="68" font-size="14">华硕 TUF / TX 同档型号；末点为 8/25</text><line class="g" x1="35" y1="198" x2="495" y2="198"/><path class="line" stroke="#61d7b4" d="M45 112 L490 156"/><g fill="#61d7b4"><circle class="dot" cx="45" cy="112" r="7"/><circle class="dot" cx="490" cy="156" r="7"/></g><g class="t m" font-size="12"><text x="32" y="224">7/21</text><text x="458" y="224">8/25</text></g><text class="t m" x="58" y="107" font-size="13">¥1,332</text><text class="t h" x="405" y="180" font-size="15">¥1,298</text></g>
