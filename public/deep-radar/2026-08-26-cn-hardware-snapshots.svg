<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
  <title id="title">中国大陆六类 PC 硬件近 30 天可验证价格快照</title>
  <desc id="desc">六个折线图展示 CPU、GPU、主板、DRAM、HDD、SSD 在 2026 年 7 月下旬至 8 月 26 日可公开复核的人民币报价点。五类无 8 月 26 日新同口径数据，末点为最近快照。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171321"/><stop offset="1" stop-color="#08080e"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".075"/><stop offset="1" stop-color="#896cff" stop-opacity=".035"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.t{font-family:system-ui,-apple-system,"PingFang SC",sans-serif}.h{fill:#f7f3ff;font-weight:700}.m{fill:#aaa3b7}.g{stroke:#fff;stroke-opacity:.08}.p{fill:url(#card);stroke:#fff;stroke-opacity:.12}.line{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:5;filter:url(#glow)}.dot{stroke:#0b0910;stroke-width:4}</style>
  </defs>
  <rect width="1200" height="1040" rx="40" fill="url(#bg)"/>
  <text class="t h" x="60" y="70" font-size="34">中国大陆 ToC 硬件价格快照</text>
  <text class="t m" x="60" y="105" font-size="16">人民币 · 2026-07 下旬—2026-08-26 · 稀疏实测点，不补造逐日价格</text>

