  <g transform="translate(50 700)"><rect class="p" width="530" height="250" rx="26"/><text class="t h" x="28" y="42" font-size="22">HDD · IronWolf Pro 8TB</text><text class="t m" x="28" y="68" font-size="14">公开页最近快照无变价；末点为 8/25</text><line class="g" x1="35" y1="198" x2="495" y2="198"/><path class="line" stroke="#60a7ff" d="M45 142 L490 142"/><g fill="#60a7ff"><circle class="dot" cx="45" cy="142" r="7"/><circle class="dot" cx="490" cy="142" r="7"/></g><g class="t m" font-size="12"><text x="32" y="224">8/11</text><text x="458" y="224">8/25</text></g><text class="t h" x="402" y="130" font-size="15">¥1,540.7</text></g>
  <g transform="translate(620 700)"><rect class="p" width="530" height="250" rx="26"/><text class="t h" x="28" y="42" font-size="22">SSD · ZHITAI Ti600 2TB</text><text class="t m" x="28" y="68" font-size="14">同一商品页；末点为 8/25 最近快照</text><line class="g" x1="35" y1="198" x2="495" y2="198"/><path class="line" stroke="#d684ff" d="M45 142 L490 142"/><g fill="#d684ff"><circle class="dot" cx="45" cy="142" r="7"/><circle class="dot" cx="490" cy="142" r="7"/></g><g class="t m" font-size="12"><text x="32" y="224">7/26</text><text x="458" y="224">8/25</text></g><text class="t h" x="425" y="130" font-size="15">¥749</text></g>
  <text class="t m" x="60" y="1002" font-size="14">来源：京东公开价、什么值得买、慢慢买；促销受账号、地区与库存影响。最近快照不等于 8/26 当日成交价。</text>
</svg>
