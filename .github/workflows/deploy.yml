name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  DEPLOYMENT_ID: ${{ github.sha }}-${{ github.run_id }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            NEXT_DEPLOYMENT_ID=${{ env.DEPLOYMENT_ID }}
          tags: |
            ghcr.io/zephyr-roc/blog:${{ env.DEPLOYMENT_ID }}
            ghcr.io/zephyr-roc/blog:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        env:
          GALLERY_NAS_URL: ${{ secrets.GALLERY_NAS_URL }}
          GALLERY_NAS_PASSWORD: ${{ secrets.GALLERY_NAS_PASSWORD }}
        with:
          host: 101.34.21.42
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GALLERY_NAS_URL,GALLERY_NAS_PASSWORD
          # The first release containing Chromium has a substantially larger
          # immutable layer. Give low-bandwidth servers enough time to pull it;
          # subsequent releases reuse the cached layer.
          command_timeout: 20m
          script: |
            set -eu

            IMAGE="ghcr.io/zephyr-roc/blog:${{ env.DEPLOYMENT_ID }}"
            PREVIOUS_IMAGE="$(docker inspect --format='{{.Config.Image}}' blog 2>/dev/null || true)"
            # Each release gets a bounded asset volume. The new and immediately
            # previous releases cover pages opened across a deployment.
            STATIC_VOLUME="blog-static-assets-${{ env.DEPLOYMENT_ID }}"

            report_disk_usage() {
              echo "Blog deployment disk usage:"
              df -h /
              docker system df
              echo "Versioned blog images: $(docker image ls --format '{{.Repository}}:{{.Tag}}' ghcr.io/zephyr-roc/blog | grep -Ec '^ghcr\.io/zephyr-roc/blog:[0-9a-f]{40}(-[0-9]+)?$' || true)"
              echo "Blog static volumes: $(docker volume ls --format '{{.Name}}' | grep -Ec '^blog-static-assets(-[0-9a-f]{40}(-[0-9]+)?)?$' || true)"
              LOG_PATH="$(docker inspect --format='{{.LogPath}}' blog 2>/dev/null || true)"
              if [ -n "$LOG_PATH" ]; then du -h "$LOG_PATH" 2>/dev/null || true; fi
            }

            cleanup_old_releases() {
              # Never remove the running image or the immediately previous
              # image, which remains available for a manual rollback.
              docker image ls --format '{{.Repository}}:{{.Tag}}' ghcr.io/zephyr-roc/blog \
                | grep -E '^ghcr\.io/zephyr-roc/blog:[0-9a-f]{40}(-[0-9]+)?$' \
                | while IFS= read -r cached_image; do
                    if [ "$cached_image" != "$IMAGE" ] && [ "$cached_image" != "$PREVIOUS_IMAGE" ]; then
                      docker image rm "$cached_image" || true
                    fi
                  done
              docker volume ls --format '{{.Name}}' \
                | grep -E '^blog-static-assets(-[0-9a-f]{40}(-[0-9]+)?)?$' \
                | while IFS= read -r old_volume; do
                    if [ "$old_volume" != "$STATIC_VOLUME" ]; then
                      docker volume rm "$old_volume" || true
                    fi
                  done
            }

            start_blog() {
              docker run -d \
                --name blog \
                --restart unless-stopped \
                --log-driver local \
                --log-opt max-size=10m \
                --log-opt max-file=3 \
                -p 127.0.0.1:3100:3000 \
                -e GALLERY_NAS_URL \
                -e GALLERY_NAS_PASSWORD \
                -v blog-data:/data \
                -v "$STATIC_VOLUME:/app/dist/client/_next/static:ro" \
                "$1"
            }

            seed_static_assets() {
              docker run --rm \
                --user 0:0 \
                -v "$STATIC_VOLUME:/retained-static" \
                "$1" \
                sh -c 'cp -a /app/dist/client/_next/static/. /retained-static/'
            }

            pkill -f '[d]ocker pull ghcr.io/zephyr-roc/blog:' || true

            report_disk_usage

            pull_attempt=1
            while ! timeout 600 docker pull "$IMAGE"; do
              if [ "$pull_attempt" -ge 2 ]; then
                echo "Unable to pull $IMAGE after $pull_attempt attempts"
                exit 1
              fi
              pull_attempt=$((pull_attempt + 1))
              sleep 5
            done

            # Preserve the new and previous hashes for pages opened around a
            # deployment, without copying every historic release indefinitely.
            docker volume create "$STATIC_VOLUME" >/dev/null
            seed_static_assets "$IMAGE"
            if [ -n "$PREVIOUS_IMAGE" ] && docker image inspect "$PREVIOUS_IMAGE" >/dev/null 2>&1; then
              seed_static_assets "$PREVIOUS_IMAGE"
            fi

            docker stop blog || true
            docker rm blog || true

            if ! start_blog "$IMAGE"; then
              if [ -n "$PREVIOUS_IMAGE" ]; then
                start_blog "$PREVIOUS_IMAGE"
              fi
              exit 1
            fi

            attempt=0
            while [ "$attempt" -lt 15 ]; do
              if docker exec blog node -e "fetch('http://127.0.0.1:3000/tinkering').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
                # Probe a historically broken CJK thumbnail without printing
                # the NAS URL or its external_token into Actions logs.
                if ! docker exec blog node -e 'fetch("http://127.0.0.1:3000/api/gallery/thumbnail?file=2594-dsc-3404-%E5%B7%B2%E5%A2%9E%E5%BC%BA-%E9%99%8D%E5%99%AA-728d508d8a4e-480w.webp", { signal: AbortSignal.timeout(100000) }).then(r => { console.log("Gallery thumbnail probe HTTP " + r.status); process.exit(r.ok ? 0 : 1); }).catch(() => { console.log("Gallery thumbnail probe timed out or failed"); process.exit(1); })'; then
                  echo "::warning::Gallery thumbnail recovery failed; see sanitized error categories below."
                  docker logs --since 3m blog 2>&1 \
                    | grep -E '^\[gallery\] Unable to (recover thumbnail|renew the NAS image token)|^Error: (NAS preview returned HTTP [0-9]+|Thumbnail is not present|fetch failed|Input buffer contains unsupported image format)|^browserType\.launch:' \
                    | tail -12 || true
                fi
                cleanup_old_releases
                report_disk_usage
                exit 0
              fi
              attempt=$((attempt + 1))
              sleep 2
            done

            docker logs blog || true
            docker stop blog || true
            docker rm blog || true
            if [ -n "$PREVIOUS_IMAGE" ]; then
              start_blog "$PREVIOUS_IMAGE"
            fi
            exit 1
