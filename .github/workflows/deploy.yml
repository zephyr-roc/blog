name: Build and Deploy

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            NEXT_DEPLOYMENT_ID=${{ github.sha }}
          tags: |
            ghcr.io/zephyr-roc/blog:${{ github.sha }}
            ghcr.io/zephyr-roc/blog:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: 101.34.21.42
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 8m
          script: |
            set -eu

            IMAGE="ghcr.io/zephyr-roc/blog:${{ github.sha }}"
            PREVIOUS_IMAGE="$(docker inspect --format='{{.Config.Image}}' blog 2>/dev/null || true)"
            STATIC_VOLUME="blog-static-assets"

            start_blog() {
              docker run -d \
                --name blog \
                --restart unless-stopped \
                -p 127.0.0.1:3100:3000 \
                -v blog-data:/data \
                -v "$STATIC_VOLUME:/app/dist/client/_next/static:ro" \
                "$1"
            }

            seed_static_assets() {
              docker run --rm \
                --user 0:0 \
                -v "$STATIC_VOLUME:/retained-static" \
                "$1" \
                sh -c 'cp -a /app/dist/client/_next/static/. /retained-static/'
            }

            pkill -f '[d]ocker pull ghcr.io/zephyr-roc/blog:' || true

            pull_attempt=1
            while ! timeout 120 docker pull "$IMAGE"; do
              if [ "$pull_attempt" -ge 3 ]; then
                echo "Unable to pull $IMAGE after $pull_attempt attempts"
                exit 1
              fi
              pull_attempt=$((pull_attempt + 1))
              sleep 5
            done

            # Content-hashed chunks are immutable, but pages opened before a
            # deployment may still reference the previous hashes. Seed a
            # persistent volume from the new image and several locally cached
            # releases before replacing the container so those requests keep
            # resolving during a version transition.
            docker volume create "$STATIC_VOLUME" >/dev/null
            seed_static_assets "$IMAGE"
            if [ -n "$PREVIOUS_IMAGE" ]; then
              seed_static_assets "$PREVIOUS_IMAGE"
            fi
            for cached_image in $(
              docker image ls \
                --format '{{.Repository}}:{{.Tag}}' \
                ghcr.io/zephyr-roc/blog \
                | grep -E '^ghcr\.io/zephyr-roc/blog:[0-9a-f]{40}$' \
                | head -n 5
            ); do
              seed_static_assets "$cached_image"
            done

            docker stop blog || true
            docker rm blog || true

            if ! start_blog "$IMAGE"; then
              if [ -n "$PREVIOUS_IMAGE" ]; then
                start_blog "$PREVIOUS_IMAGE"
              fi
              exit 1
            fi

            attempt=0
            while [ "$attempt" -lt 15 ]; do
              if docker exec blog node -e "fetch('http://127.0.0.1:3000/tinkering').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
                exit 0
              fi
              attempt=$((attempt + 1))
              sleep 2
            done

            docker logs blog || true
            docker stop blog || true
            docker rm blog || true
            if [ -n "$PREVIOUS_IMAGE" ]; then
              start_blog "$PREVIOUS_IMAGE"
            fi
            exit 1
