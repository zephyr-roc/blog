name: One-time material branch cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-material-branch-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[cleanup-material-branch]')
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged material branch
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "heads/perf/material-only-liquid-glass",
              });
              core.info("Deleted perf/material-only-liquid-glass");
            } catch (error) {
              if (error.status === 404 || error.status === 422) {
                core.info("Branch is already absent");
              } else {
                throw error;
              }
            }
