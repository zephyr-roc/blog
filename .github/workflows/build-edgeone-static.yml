name: Build EdgeOne static artifact

# Manual fallback for EdgeOne's Vinext SSR auto-detection failure.
# Produces a ready-to-upload ZIP artifact, without deploying or changing domains.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Build static site (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build static HTML and share images
        run: SHOW_ICP=1 pnpm build

      - name: Verify static files and layout contracts
        run: |
          test -s dist/client/index.html
          test -s dist/client/gallery.html
          test -s dist/client/sitemap.xml
          test -s dist/client/robots.txt
          node --test tests/gallery-viewport.test.mjs tests/gallery-shell.test.mjs tests/navigation-context.test.mjs tests/navigation-contract.test.mjs tests/rendered-html.test.mjs
          du -sh dist/client

      - name: Upload ready-to-deploy static site
        uses: actions/upload-artifact@v4
        with:
          name: edgeone-static-site
          path: dist/client/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 6
          retention-days: 7
