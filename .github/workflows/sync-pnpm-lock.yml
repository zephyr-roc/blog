name: Synchronize pnpm lockfile
on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/sync-pnpm-lock.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Resolve and update pnpm-lock.yaml
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit resolved lockfile (if changed)
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): synchronize pnpm lockfile for Vinext 1.4.4"
          git push origin HEAD:main
